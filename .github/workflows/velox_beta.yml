name: VeloxClient Beta

# Builds the Windows installer and the macOS disk images (Apple Silicon and
# Intel) on every push to main or by hand, then publishes all of them together
# on the rolling "beta" pre-release, downloadable without a GitHub account.
# Nothing is signed yet: Windows SmartScreen and macOS Gatekeeper ask once.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'distribution/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/velox_beta.yml'
  workflow_dispatch:

concurrency:
  group: velox-beta
  cancel-in-progress: true

# Beta builds skip the release profile's fat LTO: almost the same speed at
# runtime, a fraction of the link time on the runners.
env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  SQLX_OFFLINE: 'true'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-cache: true
          restore-cache: true
          cache-namespace: velox-windows

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin oneclient_app

      - name: Stage app-local VC++ runtime
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: Verify staged runtime is Microsoft-signed
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem 'target/crt/*.dll')
          if ($dlls.Count -eq 0) { Write-Error 'no CRT DLLs staged'; exit 1 }
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              Write-Error "$($dll.Name) is not a valid Microsoft-signed DLL"
              exit 1
            }
          }

      - name: Package installer (unsigned)
        shell: bash
        env:
          CI: 'true'
        run: cargo packager --release --formats nsis --verbose

      - name: Smoke-test installer layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\velox-smoke'
          $exe = (Get-ChildItem 'target/release/*-setup.exe')[0].FullName
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exited $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$dest\oneclient_app.exe")) { Write-Error 'app missing after install'; exit 1 }

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/*-setup.exe dist/VeloxClient-beta-windows-setup.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: apple-silicon
          - target: x86_64-apple-darwin
            label: intel
            deployment_target: '10.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pin deployment target (Intel)
        if: matrix.deployment_target != ''
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          save-cache: true
          restore-cache: true
          cache-namespace: velox-macos-${{ matrix.label }}

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin oneclient_app --target ${{ matrix.target }}

      - name: Package app bundle
        shell: bash
        env:
          CI: 'true'
        run: cargo packager --release --formats app --target ${{ matrix.target }} --verbose

      # Only the binary comes out linker-signed; an unsealed bundle makes
      # macOS call the download "damaged" with no way to open it. An ad-hoc
      # signature over the whole bundle turns that into the usual
      # "unidentified developer" prompt that right-click > Open gets past.
      - name: Ad-hoc sign the whole app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$(ls -d target/${{ matrix.target }}/release/*.app | head -n1)"
          test -n "$app" || { echo "::error::no .app produced"; exit 1; }
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Build disk image
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp -R "$APP_PATH" "$staging/"
          ln -s /Applications "$staging/Applications"
          mkdir -p dist
          # hdiutil's own size guess is sometimes too small for the signed
          # bundle ("No space left on device"), so give it room explicitly.
          size_mb=$(( $(du -sm "$staging" | cut -f1) * 2 + 50 ))
          hdiutil create -volname "VeloxClient" -srcfolder "$staging" -ov -format UDZO -size "${size_mb}m" \
            "dist/VeloxClient-beta-macos-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the beta release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release delete beta --cleanup-tag --yes || true
          gh release create beta dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "VeloxClient Beta" \
            --notes "Beta build from ${GITHUB_SHA::7}, built automatically by GitHub Actions.

          New look: VeloxClient is now black and white instead of purple, including the logo and app icon.

          - Windows: VeloxClient-beta-windows-setup.exe. If SmartScreen appears, click \"More info\" and then \"Run anyway\".
          - macOS (Apple Silicon or Intel): open the .dmg and drag VeloxClient into Applications. On first launch, right-click the app and choose \"Open\" (or allow it under System Settings > Privacy & Security)."
